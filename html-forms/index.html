        <h2>Información personal</h2>
<form>
    <label for="fname">Nombre de pila: </label>

    <label for="date">Cumpleaños: </label>

    <input type="radio" name="gender" value="Male"><span>Male</span>
    <input type="radio" name="gender" value="Female"><span>Female</span>
    <br>
    <label for="number">Número de teléfono: </label>
    <input type="number" name="number"  required>
    <br>
    <label for="email">Correo electrónico: </label>
    <input type="text" name="email"  required>
    <br>
 <h2>Contacto de emergencia</h2>
 <b><p>Progenitor 1</p></b>
    <label for="fname">Nombre: </label>
    <input type="text" name="fname"  required>
    <br>
    <label for="email">Correo electrónico: </label>
    <input type="email" name="email"  required>
    <br>
    <label for="number">Número de teléfono: </label>
    <input type="number" name="number"  required>

    <b><p>Progenitor 2</p></b>

    <input type="number" name="number"  required>
    <br>
    <b><h2>Residencia</h2></b>
    <label for="place">Estaca / Distrito / Misión : </label>
    <input type="text" name="place"  required>
    <br>
    <label for="place">Barrio / Rama : </label>
    <input type="place" name="place"  required>
    <br>
    <label for="name">Obispo: </label>
    <input type="text" name="name"  required>
    <br>
    <b><h2>Detalles especiales</h2></b>
    <label for="text">Talla de camiseta: </label>
    <input type="radio" name="text" value="CH"><span>CH</span>
    <input type="radio" name="text" value="M"><span>M</span>
    <input type="radio" name="text" value="G"><span>G</span>
    <input type="radio" name="text" value="XG"><span>XG</span>
    <input type="radio" name="text" value="XXG"><span>XXG</span>

    <label for="text">¿Requiere una dieta especial? </label>

    <input type="radio" name="text" value="No"><span>No</span>
    <br>
    <label for="text">Si la respuesta es Sí, especifique las restricciones alimentarias: </label>
    <input type="text" name="text"  required>
    <br>
    <label for="text">¿Tiene el participante alergias?  </label>
    <input type="radio" name="text" value="Si"><span>Si</span>
    <input type="radio" name="text" value="No"><span>No</span>

    <input type="text" name="text"  required>
